# config for the download and processing of both datasets

seed: 42
logging_path: "logs/datasets/all_full_processing.log"
split_ratio:
  train: 0.8
  val: 0.1
  test: 0.1

directories:
  raw_dir: "data/raw"
  output_dir: "data/processed"

datasets:
  kaggle_korean:
    source_id: "kimhyeongminkhu/korean-expiry-date-ocr"
    raw_path: "data/raw/kaggle_korean"
    data_type: "kaggle_yolo_nested"

  hf_dimun:
    source_id: "dimun/ExpirationDate"
    file_name: "Products-Real.zip"
    raw_path: "data/raw/hf_dimun"
    data_type: "hf_zip"